<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สุขสันต์วันเกิด Nongclean 🎂</title>
<style>
:root{--bg:#fff6f0;--card:#ffffff;--text:#3b2a2a;--sub:#8a6f6f;--accent:#ff6f91;--accent2:#ffb36b;--shadow:rgba(255,111,145,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1418;--card:#2a1d23;--text:#fbeeee;--sub:#c9a9ae;--shadow:rgba(255,111,145,.2);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1418;--card:#2a1d23;--text:#fbeeee;--sub:#c9a9ae;--shadow:rgba(255,111,145,.2);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:min(92vw,420px);text-align:center;padding:16px}
.cake{font-size:84px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
h1{font-size:28px;margin:12px 0 4px}
h1 span{color:var(--accent)}
.sub{color:var(--sub);margin:0 0 24px}
.card{background:var(--card);border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px var(--shadow);min-height:120px;display:none;align-items:center;justify-content:center;font-size:19px;line-height:1.7;margin-bottom:20px}
.card.show{display:flex;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
button{font:inherit;font-size:18px;font-weight:600;color:#fff;border:0;border-radius:999px;padding:15px 32px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px var(--shadow);cursor:pointer;transition:transform .15s}
button:active{transform:scale(.94)}
.count{margin-top:14px;font-size:14px;color:var(--sub);min-height:20px}
.gate{width:min(92vw,360px);text-align:center;padding:16px}
.gate input{font:inherit;font-size:18px;width:100%;box-sizing:border-box;text-align:center;padding:14px;border-radius:999px;border:2px solid var(--accent2);background:var(--card);color:var(--text);margin:0 0 16px;outline:none}
.gate .err{color:var(--accent);min-height:22px;margin-top:12px;font-size:15px}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.song{display:inline-block;margin-top:18px;padding:10px 20px;border-radius:999px;border:2px solid var(--accent2);color:var(--text);text-decoration:none;font-size:15px;font-weight:600}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
.ctl button{font-size:15px;padding:8px 16px;box-shadow:none}
.ctl span{font-size:14px;color:var(--sub);min-width:40px}
canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- หน้าใส่รหัสผ่าน -->
<div class="gate" id="gate">
  <div class="cake">🔒</div>
  <h1>ใส่รหัสก่อนนะ</h1>
  <p class="sub">มีของขวัญรอ Nongclean อยู่</p>
  <input id="pw" type="password" placeholder="รหัส" autocomplete="off">
  <button id="go">เปิดเลย</button>
  <div class="err" id="err"></div>
</div>

<!-- หน้าหลักหลังจากปลดล็อก -->
<div class="wrap" id="main" style="display:none">
  <div class="cake">🎂</div>
  <h1>ถึง <span>Nongclean</span></h1>
  <p class="sub">มีของขวัญรออยู่ข้างใน…</p>
  <div class="card" id="card"></div>
  <button id="btn">🎁 กดตรงนี้เลย</button>
  <div class="count" id="count"></div>
  
  <!-- แถบควบคุมเสียงเพลง -->
  <div class="ctl">
    <button id="pp" onclick="togglePlay()">⏸ พัก</button>
    <button onclick="setVol(-0.1)">🔉 -</button>
    <span id="vl">70%</span>
    <button onclick="setVol(0.1)">🔊 +</button>
  </div>

  <br>
  <a class="song" href="https://open.spotify.com/track/60nZcImufyMA1MKQY3dcCH" target="_blank" rel="noopener">🎵 ฟังเพลง Happy – Pharrell Williams บน Spotify</a>
</div>

<!-- ไฟล์เพลง Happy.mp3 ที่อยู่โฟลเดอร์เดียวกัน -->
<audio id="bgm" loop preload="auto">
  <source src="Happy.mp3" type="audio/mpeg">
</audio>
